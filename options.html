
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TruthLens Settings</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      max-width: 560px;
      margin: 32px auto;
      padding: 0 18px;
      color: #222;
    }

    .panel {
      background: #f5f5f5;
      padding: 16px;
      border-radius: 10px;
    }

    button {
      padding: 9px 14px;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h2>TruthLens Settings</h2>

  <div class="panel">
    <h3>Local AI model</h3>
    <p><strong>Runtime:</strong> Ollama</p>
    <p><strong>Model:</strong> qwen2.5:3b-instruct</p>
    <p>No cloud API key is required.</p>

    <button id="check" type="button">
      Check Ollama connection
    </button>

    <div id="status" role="status" aria-live="polite">
      Click the button to test your local model server.
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
